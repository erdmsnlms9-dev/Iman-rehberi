name: Build Iman Rehberi APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ImanRehberi-APK-DerlemePaketi.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract package
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          unzip -o ImanRehberi-APK-DerlemePaketi.zip -d buildsrc

      - name: Install dependencies
        working-directory: buildsrc
        run: npm install

      - name: Add Android
        working-directory: buildsrc
        run: npx cap add android

      - name: Build APK
        working-directory: buildsrc/android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Iman-Rehberi-APK
          path: buildsrc/android/app/build/outputs/apk/debug/app-debug.apk
